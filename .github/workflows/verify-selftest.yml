name: Verify Image self-test

on:
  push:
    branches:
      - fix/susfs-makefile-integration
    paths:
      - .github/workflows/verify-selftest.yml

jobs:
  verify-selftest:
    runs-on: ubuntu-24.04
    steps:
      - name: Test artifact verification logic
        shell: bash
        run: |
          set -u

          verify_pair() {
            local image="$1"
            local relfile="$2"

            [ -s "$image" ] || return 10

            local rel banner
            rel=$(cat "$relfile" 2>/dev/null || true)
            [ -n "$rel" ] || return 11

            banner=$(strings "$image" | grep -m1 -F "Linux version " || true)
            [ -n "$banner" ] || return 12

            case "$banner" in
              "Linux version $rel "*) return 0 ;;
              *) return 13 ;;
            esac
          }

          TMP=$(mktemp -d)
          RELFILE="$TMP/kernel.release"
          GOOD="$TMP/good.Image"
          BAD="$TMP/bad.Image"
          EMPTY="$TMP/empty.Image"
          NOBANNER="$TMP/no-banner.Image"

          printf '%s\n' '6.6.142-4k-gdeadbeefcafe' > "$RELFILE"
          printf '%s\n' 'Linux version 6.6.142-4k-gdeadbeefcafe (Lingguang@kernel-builder) #1 SMP PREEMPT' > "$GOOD"
          printf '%s\n' 'Linux version 6.6.139-4k-gdeadbeefcafe (Lingguang@kernel-builder) #1 SMP PREEMPT' > "$BAD"
          : > "$EMPTY"
          printf '%s\n' 'not a kernel image' > "$NOBANNER"

          verify_pair "$GOOD" "$RELFILE"
          echo 'PASS: matching Image/release accepted'

          if verify_pair "$BAD" "$RELFILE"; then
            echo 'ERROR: mismatched Image/release was accepted'
            exit 1
          else
            RC=$?
            [ "$RC" -eq 13 ] || { echo "ERROR: unexpected mismatch result: $RC"; exit 1; }
          fi
          echo 'PASS: mismatched Image/release rejected'

          if verify_pair "$EMPTY" "$RELFILE"; then
            echo 'ERROR: empty Image was accepted'
            exit 1
          else
            RC=$?
            [ "$RC" -eq 10 ] || { echo "ERROR: unexpected empty-image result: $RC"; exit 1; }
          fi
          echo 'PASS: empty Image rejected'

          if verify_pair "$NOBANNER" "$RELFILE"; then
            echo 'ERROR: Image without Linux banner was accepted'
            exit 1
          else
            RC=$?
            [ "$RC" -eq 12 ] || { echo "ERROR: unexpected no-banner result: $RC"; exit 1; }
          fi
          echo 'PASS: Image without Linux banner rejected'
