name: Upload AOSP Clang Toolchain

on:
  workflow_dispatch:      # 手动触发（一次性：下载 AOSP clang 打包上传 Release）

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 下载 AOSP clang r563880c
        run: |
          # git clone prebuilts 仓库 + checkout 指定 commit（r563880c 在 f8439f06）
          git clone --depth 1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-prebuilts
          cd clang-prebuilts
          git fetch --depth 1 origin f8439f0628d799092dd07df440a6334cab28939c
          git checkout FETCH_HEAD
          git sparse-checkout set clang-r563880c
          cd ..
          # 打包工具链
          tar czf clang-r563880c.tar.gz -C clang-prebuilts/clang-r563880c .
          ls -lh clang-r563880c.tar.gz

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat <<'MD' > notes.md
          # AOSP Clang 21.0.0 (r563880c)

          Official Android prebuilt toolchain (clang/llvm/lld 21.0.0).
          Matches the exact toolchain used to build the OnePlus Ace 6 official kernel (IKCONFIG: r563880c).

          ## Asset

          | File | Description |
          |---|---|
          | clang-r563880c.tar.gz | Full Linux x86_64 toolchain (extract & use) |

          ## Usage

          Workflow downloads this asset, extracts it, and adds `bin/` to PATH before building.
          MD
          gh release create "AOSP-Clang-21.0.0-r563880c" \
            --notes-file notes.md \
            clang-r563880c.tar.gz
