name: Upstream drift check

# The checker compares locked and candidate trees cumulatively. A failed apply
# is a review trigger, not an automatic diagnosis or lock update. This workflow
# uploads a report and an Issue draft; it never creates or edits an Issue.

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run cumulative upstream drift check
        env:
          ACE6_DRIFT_REPORT_DIR: work/_tmp/drift-report
        run: mkdir -p "$ACE6_DRIFT_REPORT_DIR" && ./check_upstream.sh --ci

      - name: Upload drift report and draft
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-drift-report
          path: work/_tmp/drift-report
          if-no-files-found: error
