name: Build Ace6 Kernel (TEST)

on:
  workflow_dispatch:      # 手动触发（主入口）
    inputs:
      # ---------- KernelSU ----------
      ksu_type:
        description: 'KernelSU 分支（ReSukiSU/SukiSU-Ultra/KernelSU-Next/KSU 原版/无内置）'
        required: true
        type: choice
        default: 'resukisu'
        options:
          - 'resukisu'
          - 'none'
      susfs_enable:
        description: 'SUSFS（依赖 KSU 非 none；增强隐藏环境挂载）'
        required: true
        type: boolean
        default: 'true'
      # ---------- 性能 ----------
      lz4_zstd:
        description: 'lz4 1.10 + zstd 1.5.7（压缩性能优化）'
        required: true
        type: boolean
        default: 'true'
      lz4kd_enable:
        description: 'LZ4KD 算法（推荐与 lz4+zstd 同开）'
        required: true
        type: boolean
        default: 'false'
      # ---------- 功能 ----------
      droidspaces:
        description: 'Droidspaces 容器（standard=容器+ntsync，extend=更多测试项）'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      baseband_guard:
        description: '内核级基带保护（防格机）'
        required: true
        type: boolean
        default: 'true'
      cve_patch:
        description: 'CVE 安全补丁（rtmutex）'
        required: true
        type: boolean
        default: 'true'
      better_net:
        description: '网络功能拓展（ipset/iptables 高级支持）'
        required: true
        type: boolean
        default: 'false'
      # ---------- 署名 ----------
      attribution_enable:
        description: '产物署名（编译标签/KSU 版本串/AK3）'
        required: true
        type: boolean
        default: 'true'
      build_user:
        description: '署名用户（attribution_enable 开启时生效）'
        required: false
        type: string
        default: 'GuLingguang'
      build_host:
        description: '署名主机（attribution_enable 开启时生效，默认 kernel-builder）'
        required: false
        type: string
        default: 'kernel-builder'
      # ---------- 发布 ----------
      release_enable:
        description: '发布 GitHub Release'
        required: true
        type: boolean
        default: 'false'
      ccache_update:
        description: '更新公共 ccache 缓存（构建完成后上传到 public_ccache 仓库）'
        required: true
        type: boolean
        default: 'false'
      tag:
        description: 'Release 标签（留空自动用日期）'
        required: false
        type: string
        default: ''

concurrency:
  group: build-kernel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      ak3name: ${{ steps.package.outputs.ak3name }}
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
    steps:
      - uses: actions/checkout@v4

      # ---------- 工具链: AOSP clang r563880c（从本仓库 Release 下载）----------
      - name: 安装 AOSP clang 21 + 依赖
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip zstd patch bc flex bison \
            libssl-dev libncurses-dev libelf-dev dwarves python3 ccache
          # 从 Release 下载官方工具链（AOSP-Clang-21.0.0-r563880c）
          gh release download "AOSP-Clang-21.0.0-r563880c" -p "clang-r563880c.tar.gz" -R $GITHUB_REPOSITORY
          mkdir -p clang
          tar xzf clang-r563880c.tar.gz -C clang
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"

      - name: 验证工具链
        run: clang --version && clang -print-prog-name=ld.lld

      # ---------- ccache 缓存（仿 cctv18）----------
      - name: 清理 runner 空间（并行）
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          wait
          df -h

      - name: 配置 ccache
        run: |
          # 使用 ccache-ECS（特化内核编译缓存，cctv18 式）
          sudo cp -f $GITHUB_WORKSPACE/lib/ccache-ecs /usr/local/bin/ccache
          sudo chmod +x /usr/local/bin/ccache
          echo "CCACHE_DIR=$HOME/.ccache_ace6" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          # sloppiness：放宽缓存匹配，提升跨构建命中率（cctv18 式）
          mkdir -p "$HOME/.ccache_ace6"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$HOME/.ccache_ace6/ccache.conf"
          ccache --version

      - name: 载入 ccache 缓存
        uses: actions/cache@v5
        id: ccache-restore
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-ace6-O2-FT-${{ runner.os }}-
            ccache-ace6-O2-FT-

      - name: 拉取公共 ccache 缓存（Release）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # actions/cache 命中则跳过
          if [ -d "${{ env.CCACHE_DIR }}" ] && [ "$(ls -A ${{ env.CCACHE_DIR }} 2>/dev/null)" ]; then
            echo "本地缓存已命中，跳过公共缓存拉取"
            exit 0
          fi
          # 从 Release 拉取公共缓存（ccache-ace6 资产）
          echo "未命中本地缓存，尝试拉取公共 ccache ..."
          mkdir -p ${{ env.CCACHE_DIR }}
          if gh release download -p "ccache-ace6-O2-FT.tar.zst" -R $GITHUB_REPOSITORY 2>/dev/null; then
            echo "成功下载公共 ccache，解压中..."
            tar -I zstd -xf ccache-ace6-O2-FT.tar.zst -C ${{ env.CCACHE_DIR }}
            echo "公共 ccache 恢复完成！"
          else
            echo "公共 ccache 不存在（首次构建），跳过"
          fi

      # ---------- 准备源码: 基线三兄弟 ----------
      - name: 准备源码基线
        run: |
          set -e
          mkdir -p work
          cd work
          # 源码用 zip 下载分支头（cctv18 式，三仓并行下载）
          curl -sL "${{ vars.REPO_BASE || 'https://github.com' }}/GuLingguang/oneplus-sm8750-kernel-pro/archive/refs/heads/lineage-23.2.zip" -o src.zip &
          curl -sL "${{ vars.REPO_BASE || 'https://github.com' }}/Ace6-Development/android_kernel_oneplus_sm8750-modules/archive/refs/heads/lineage-23.2.zip" -o modules.zip &
          curl -sL "${{ vars.REPO_BASE || 'https://github.com' }}/LineageOS/android_kernel_oneplus_sm8750-devicetrees/archive/refs/heads/lineage-23.2.zip" -o dt.zip &
          wait
          unzip -q src.zip && mv oneplus-sm8750-kernel-pro-lineage-23.2 src
          unzip -q modules.zip && mv android_kernel_oneplus_sm8750-modules-lineage-23.2 sm8750-modules
          unzip -q dt.zip && mv android_kernel_oneplus_sm8750-devicetrees-lineage-23.2 sm8750-devicetrees
          rm -f src.zip modules.zip dt.zip
          # 验证符号链接目标
          for t in src/drivers/base/kernelFwUpdate/Kconfig src/arch/arm64/boot/dts/vendor; do
            [ -e "$t" ] || { echo "符号链接目标缺失: $t"; exit 1; }
          done

      # ---------- 应用补丁（按功能开关）----------
      - name: 应用编译修复补丁（必打）
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/07_compile_fixes.patch
        working-directory: work/src

      - name: 应用 KSU 钩子补丁（ksu_type != none 必打）
        if: ${{ inputs.ksu_type != 'none' }}
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/00_ksu_hooks.patch
        working-directory: work/src

      - name: 应用 SUSFS 主树补丁
        if: ${{ inputs.susfs_enable && inputs.ksu_type != 'none' }}
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/01_susfs_main.patch
        working-directory: work/src

      - name: 应用 lz4 补丁
        if: inputs.lz4_zstd
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/02_lz4.patch
        working-directory: work/src

      - name: 应用 zstd 补丁
        if: inputs.lz4_zstd
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/03_zstd.patch
        working-directory: work/src

      - name: 应用 LZ4KD 补丁
        if: inputs.lz4kd_enable
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/04_lz4kd.patch
        working-directory: work/src

      - name: 应用 Droidspaces 补丁
        if: ${{ inputs.droidspaces != 'false' }}
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/05_droidspaces.patch
        working-directory: work/src

      - name: 应用基带保护补丁
        if: inputs.baseband_guard
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/06_baseband_guard.patch
        working-directory: work/src

      - name: 应用 CVE 补丁
        if: inputs.cve_patch
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/08_cve.patch
        working-directory: work/src

      # ---------- 复制 extra 新增文件（按功能开关，替代旧 snapshot）----------
      - name: 复制 extra 新增文件
        run: |
          set -e
          # SUSFS 新增文件
          if [ "${{ inputs.susfs_enable }}" = "true" ] && [ "${{ inputs.ksu_type }}" != "none" ]; then
            cp -r patches/extra/fs/susfs.c work/src/fs/
            cp -r patches/extra/include/linux/susfs.h patches/extra/include/linux/susfs_def.h work/src/include/linux/
          fi
          # lz4 1.10 新库文件
          if [ "${{ inputs.lz4_zstd }}" = "true" ]; then
            cp -r patches/extra/lib/lz4 work/src/lib/
          fi
          # zstd 1.5.7 新库文件
          if [ "${{ inputs.lz4_zstd }}" = "true" ]; then
            cp -r patches/extra/lib/zstd/common/allocations.h patches/extra/lib/zstd/common/bits.h work/src/lib/zstd/common/
            cp -r patches/extra/lib/zstd/compress/zstd_preSplit.c patches/extra/lib/zstd/compress/zstd_preSplit.h work/src/lib/zstd/compress/
          fi
          # LZ4KD 新增文件
          if [ "${{ inputs.lz4kd_enable }}" = "true" ]; then
            cp -r patches/extra/crypto/lz4k.c patches/extra/crypto/lz4kd.c work/src/crypto/
            cp -r patches/extra/include/linux/lz4k.h patches/extra/include/linux/lz4kd.h work/src/include/linux/
            cp -r patches/extra/lib/lz4k work/src/lib/
            cp -r patches/extra/lib/lz4kd work/src/lib/
          fi
          # Droidspaces 新增文件
          if [ "${{ inputs.droidspaces }}" != "false" ]; then
            cp -r patches/extra/drivers/misc/ntsync.c work/src/drivers/misc/
            cp -r patches/extra/include/uapi/linux/ntsync.h work/src/include/uapi/linux/
            cp -r patches/extra/drivers/gpu/drm/evdi work/src/drivers/gpu/drm/
          fi
          # Baseband-guard 新增文件
          if [ "${{ inputs.baseband_guard }}" = "true" ]; then
            cp -r patches/extra/Baseband-guard work/src/
            ln -sfn ../Baseband-guard work/src/security/baseband-guard
          fi

      # ---------- KernelSU（按 ksu_type 分支）----------
      - name: 集成 KernelSU
        if: ${{ inputs.ksu_type != 'none' }}
        run: |
          set -e
          cd work/src
          case "${{ inputs.ksu_type }}" in
            resukisu) KSU_REPO="https://github.com/ReSukiSU/ReSukiSU.git" ;;
            none)     echo "无 KSU"; exit 0 ;;
          esac
          rm -rf KernelSU drivers/kernelsu
          git clone "$KSU_REPO" KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
        env:
          KSU_REPO: ""

      # ---------- KSU 版本号 ----------
      - name: 计算 KSU 版本号
        id: ksu_version
        if: ${{ inputs.ksu_type != 'none' }}
        run: |
          COUNT=$(git -C work/src/KernelSU rev-list --count HEAD)
          VER=$((30000 + COUNT + 700))
          echo "ksuver=$VER" >> "$GITHUB_OUTPUT"
          echo "KSU 版本号: $VER ($COUNT 提交)"

      # ---------- SUSFS 的 KSU 内部适配 ----------
      - name: 应用 SUSFS KSU 适配补丁
        if: ${{ inputs.susfs_enable && inputs.ksu_type != 'none' }}
        run: |
          cd KernelSU
          git apply --check $GITHUB_WORKSPACE/patches/02_ksu.patch 2>/dev/null && git apply $GITHUB_WORKSPACE/patches/02_ksu.patch \
            || echo "⚠ 02_ksu.patch 未自动应用（KSU 版本可能已变，需人工适配）" >&2
        working-directory: work/src

      # ---------- 署名 ----------
      - name: 配置署名
        run: |
          if [ "${{ inputs.attribution_enable }}" = "true" ]; then
            echo "BUILD_USER=${{ inputs.build_user }}" >> "$GITHUB_ENV"
            echo "BUILD_HOST=${{ inputs.build_host }}" >> "$GITHUB_ENV"
            # KSU 版本串署名（REPO_NAME）
            if [ "${{ inputs.ksu_type }}" != "none" ]; then
              sed -i "s/^REPO_NAME := .*/REPO_NAME := ${{ inputs.build_user }}/" work/src/KernelSU/kernel/Kbuild
            fi
          else
            echo "BUILD_USER=" >> "$GITHUB_ENV"
            echo "BUILD_HOST=" >> "$GITHUB_ENV"
          fi

      # ---------- 配置 ----------
      - name: 部署配置
        run: |
          set -e
          cd work/src
          cp $GITHUB_WORKSPACE/config/config_ace6_final.config .config
          # 按开关调整配置
          if [ "${{ inputs.ksu_type }}" = "none" ]; then
            ./scripts/config --file .config -d CONFIG_KSU -d CONFIG_KSU_SUSFS
          fi
          if [ "${{ inputs.susfs_enable }}" != "true" ] || [ "${{ inputs.ksu_type }}" = "none" ]; then
            ./scripts/config --file .config -d CONFIG_KSU_SUSFS
          fi
          if [ "${{ inputs.droidspaces }}" = "false" ]; then
            ./scripts/config --file .config \
              -d CONFIG_SYSVIPC -d CONFIG_NTSYNC -d CONFIG_DRM_LINDROID_EVDI
          fi
          if [ "${{ inputs.droidspaces }}" != "extend" ]; then
            ./scripts/config --file .config -d CONFIG_DRM_LINDROID_EVDI
          fi
          if [ "${{ inputs.lz4kd_enable }}" != "true" ]; then
            ./scripts/config --file .config \
              -d CONFIG_LZ4K_COMPRESS -d CONFIG_LZ4KD_COMPRESS -d CONFIG_CRYPTO_LZ4K -d CONFIG_CRYPTO_LZ4KD
          fi
          if [ "${{ inputs.baseband_guard }}" != "true" ]; then
            ./scripts/config --file .config -d CONFIG_BBG
          fi
          if [ "${{ inputs.better_net }}" != "true" ]; then
            ./scripts/config --file .config -d CONFIG_IP_SET -d CONFIG_BPF_STREAM_PARSER -d CONFIG_IP6_NF_NAT
          fi
          export LLVM=1 LLVM_IAS=1
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 olddefconfig
          grep -q 'CONFIG_LOCALVERSION="-4k-gdc4c44f3ecc0-dirty"' .config || exit 1

      # ---------- 编译 ----------
      - name: 编译内核
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          export LLVM=1 LLVM_IAS=1
          export LOCALVERSION=""
          export KBUILD_BUILD_USER="$BUILD_USER"
          export KBUILD_BUILD_HOST="$BUILD_HOST"
          # faketime 时间劫持（可复现构建 + ccache 命中稳定，cctv18 式）
          cd $GITHUB_WORKSPACE
          chmod 777 lib/*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          SO_DIR="$GITHUB_WORKSPACE/lib"
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          chmod +x cc-wrapper ld-wrapper
          cd work/src
          set -o pipefail
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="$GITHUB_WORKSPACE/cc-wrapper" LD="$GITHUB_WORKSPACE/ld-wrapper" HOSTLD=ld.lld KCFLAGS+=-O2 -j$(nproc) Image
          echo "ccache 状态:"
          ccache -s
          [ -f arch/arm64/boot/Image ] || exit 1

      # ---------- 验证 ----------
      - name: 验证产物
        run: |
          cd work/src
          grep -q '6.6.139-4k-gdc4c44f3ecc0-dirty' include/generated/utsrelease.h || exit 1
          strings arch/arm64/boot/Image | grep -q "Linux version 6.6.139" || exit 1
          ls -la arch/arm64/boot/Image

      # ---------- 保存 ccache 缓存 ----------
      - name: 保存 ccache 缓存（本地）
        if: ${{ inputs.ccache_update }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}

      - name: 上传公共 ccache 缓存（Release）
        if: ${{ inputs.ccache_update }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 打包 ccache 并上传到 Release（公共缓存，供他人/下次构建拉取）
          echo "打包公共 ccache ..."
          tar -I zstd -cf ccache-ace6-O2-FT.tar.zst -C ${{ env.CCACHE_DIR }} .
          echo "ccache 大小: $(du -sh ccache-ace6-O2-FT.tar.zst | cut -f1)"
          # 上传（若 Release 不存在则创建）
          gh release create "ccache-ace6-O2-FT" ccache-ace6-O2-FT.tar.zst --notes "Public ccache for Ace6 kernel builds" 2>/dev/null \
            || gh release upload "ccache-ace6-O2-FT" ccache-ace6-O2-FT.tar.zst --clobber
          echo "公共 ccache 已上传！

      # ---------- 打包 AK3 ----------
      - name: 打包 AK3
        id: package
        run: |
          set -e
          mkdir -p out pack
          [ -f work/src/arch/arm64/boot/Image ] || { echo "❌ Image 不存在"; exit 1; }
          cp -a ak3/. pack/
          cp work/src/arch/arm64/boot/Image pack/Image
          # 验证 Image 存在且非空（不写死大小——随功能/上游变化）
          SIZE=$(stat -c%s work/src/arch/arm64/boot/Image)
          echo "Image 大小: $SIZE"
          [ "$SIZE" -gt 0 ] || { echo "❌ Image 为空"; exit 1; }
          # AK3 署名
          if [ "${{ inputs.attribution_enable }}" = "true" ]; then
            sed -i "s#kernel.string=.*#kernel.string=Ace6 Kernel | Build by ${{ inputs.build_user }}#" pack/anykernel.sh
          else
            sed -i "s#kernel.string=.*#kernel.string=Ace6 Kernel#" pack/anykernel.sh
          fi
          STAMP=$(date +%Y%m%d)
          KSUVER="${{ steps.ksu_version.outputs.ksuver }}"
          ZIP="Kernel-Ace6-${{ inputs.build_user }}-ksu${KSUVER}-$STAMP.zip"
          cd pack && zip -r9 "../out/$ZIP" . -x "*.git*" >/dev/null
          echo "ak3name=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh "../out/$ZIP"

      # ---------- 上传产物 ----------
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ak3name }}
          path: out/*.zip
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.release_enable }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: release_zips
      - name: 发布 Release
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(date +%Y%m%d)-ksu${{ needs.build.outputs.ksuver }}"
          fi
          cat <<EOF > release_notes.md
          # Ace6 Kernel Build

          ## 版本信息
          - 内核: 6.6.139-4k
          - KernelSU: ${{ needs.build.outputs.ksuver }}
          - 构建日期: $(date +%Y-%m-%d)

          ## 包含功能
          - KernelSU: ${{ inputs.ksu_type }}
          - SUSFS: ${{ inputs.susfs_enable }}
          - lz4/zstd: ${{ inputs.lz4_zstd }}
          - LZ4KD: ${{ inputs.lz4kd_enable }}
          - Droidspaces: ${{ inputs.droidspaces }}
          - 基带保护: ${{ inputs.baseband_guard }}
          - CVE 补丁: ${{ inputs.cve_patch }}

          ## 管理器下载
          - ReSukiSU: https://github.com/ReSukiSU/ReSukiSU/releases
          - SukiSU Ultra: https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases
          - KernelSU Next: https://github.com/KernelSU-Next/KernelSU-Next/releases
          - KSU 原版: https://github.com/tiann/KernelSU/releases

          ## 刷入
          recovery 刷入 AK3 zip 即可
          EOF
          gh release create "$TAG" \
            --notes-file release_notes.md \
            release_zips/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
