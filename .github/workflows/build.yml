name: Build Ace6 Kernel

on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'KernelSU variant (resukisu or none)'
        required: true
        type: choice
        default: 'none'
        options: ['resukisu', 'none']
      susfs_enable:
        description: 'SUSFS mount/root hiding (requires KernelSU)'
        required: true
        type: boolean
        default: false
      lz4_zstd:
        description: 'Use the locked LZ4 1.10.0 and zstd 1.5.7 kernel sources'
        required: true
        type: boolean
        default: false
      lz4kd_enable:
        description: 'Enable the locked LZ4KD zram compressor'
        required: true
        type: boolean
        default: false
      show_all_algos:
        description: 'Enable all zram compressor backends'
        required: true
        type: boolean
        default: false
      zram_writeback:
        description: 'Enable zram writeback (runtime backing_dev setup is separate)'
        required: true
        type: boolean
        default: false
      droidspaces:
        description: 'Droidspaces mode'
        required: true
        type: choice
        default: 'false'
        options: ['false', 'standard', 'extend']
      baseband_guard:
        description: 'Enable Baseband Guard'
        required: true
        type: boolean
        default: false
      cve_patch:
        description: 'Compatibility switch; lineage-23.2 already carries the fixes'
        required: true
        type: boolean
        default: false
      better_net:
        description: 'Enable the locked better-network config dependencies'
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: 'Enable BBR without changing the default congestion control'
        required: true
        type: boolean
        default: false
      kpm_enable:
        description: 'KPM/KPN (requires a pinned T17 resource)'
        required: true
        type: boolean
        default: false
      rekernel_enable:
        description: 'Experimental Re:Kernel (requires its runtime gate)'
        required: true
        type: boolean
        default: false
      kernel_suffix:
        description: 'Kernel version suffix; empty uses the locked source commit'
        required: false
        type: string
        default: ''
      attribution_enable:
        description: 'Include build attribution'
        required: true
        type: boolean
        default: true
      build_user:
        description: 'Attribution user'
        required: false
        type: string
        default: 'Lingguang'
      build_host:
        description: 'Attribution host'
        required: false
        type: string
        default: 'kernel-builder'
      release_enable:
        description: 'Create a GitHub Release (separate publication gate)'
        required: true
        type: boolean
        default: false
      artifact_mode:
        description: 'Supported artifact mode (AK3; raw Image is local-only)'
        required: true
        type: choice
        default: 'ak3'
        options: ['ak3']
      ccache_update:
        description: 'Update public ccache'
        required: true
        type: boolean
        default: false
      ccache_debug:
        description: 'Upload ccache debug logs'
        required: true
        type: boolean
        default: false
      tag:
        description: 'Release tag; empty uses a generated tag'
        required: false
        type: string
        default: ''
      build_time:
        description: 'KBUILD_BUILD_TIMESTAMP; empty leaves the toolchain default'
        required: false
        type: string
        default: ''
      debug_skip_build:
        description: 'Skip compilation and package a clearly marked dummy Image'
        required: true
        type: boolean
        default: false

concurrency:
  group: build-kernel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Canonical input adapter for scripts/build.py.  The workflow never
      # interpolates user text into shell source or sed expressions.
      ACE6_KSU_TYPE: ${{ inputs.ksu_type }}
      ACE6_SUSFS: ${{ inputs.susfs_enable }}
      ACE6_LZ4_ZSTD: ${{ inputs.lz4_zstd }}
      ACE6_LZ4KD: ${{ inputs.lz4kd_enable }}
      ACE6_SHOW_ALL_ALGOS: ${{ inputs.show_all_algos }}
      ACE6_ZRAM_WRITEBACK: ${{ inputs.zram_writeback }}
      ACE6_DROIDSPACES: ${{ inputs.droidspaces }}
      ACE6_BASEBAND_GUARD: ${{ inputs.baseband_guard }}
      ACE6_CVE_PATCH: ${{ inputs.cve_patch }}
      ACE6_BETTER_NET: ${{ inputs.better_net }}
      ACE6_BBR: ${{ inputs.bbr_enable }}
      ACE6_KPM: ${{ inputs.kpm_enable }}
      ACE6_REKERNEL: ${{ inputs.rekernel_enable }}
      ACE6_KERNEL_SUFFIX: ${{ inputs.kernel_suffix }}
      ACE6_ATTRIBUTION_ENABLE: ${{ inputs.attribution_enable }}
      ACE6_BUILD_USER: ${{ inputs.build_user }}
      ACE6_BUILD_HOST: ${{ inputs.build_host }}
      ACE6_BUILD_TIME: ${{ inputs.build_time }}
      ACE6_TAG: ${{ inputs.tag }}
      ACE6_RELEASE_ENABLE: ${{ inputs.release_enable }}
      ACE6_CCACHE_UPDATE: ${{ inputs.ccache_update }}
      ACE6_CCACHE_DEBUG: ${{ inputs.ccache_debug }}
      ACE6_DEBUG_SKIP_BUILD: ${{ inputs.debug_skip_build }}
      ACE6_ARTIFACT_MODE: ${{ inputs.artifact_mode }}
      ACE6_CCACHE_ENABLE: 'true'
      ACE6_INDEPENDENT_MODULES: 'false'
      ACE6_GHOST_TASK: 'false'
      ACE6_REPO_BASE: ${{ vars.REPO_BASE || 'https://github.com' }}
      ACE6_WORK: ${{ github.workspace }}/work
      ACE6_OUT: ${{ github.workspace }}/out
    outputs:
      ak3name: ${{ steps.common_build.outputs.ak3name }}
      ksuver: ${{ steps.common_build.outputs.ksuver }}
      kernelrel: ${{ steps.common_build.outputs.kernelrel }}
      kernelver: ${{ steps.common_build.outputs.kernelver }}
      release_allowed: ${{ steps.common_build.outputs.release_allowed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install locked toolchain and host dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip zstd patch bc flex bison libssl-dev libncurses-dev libelf-dev dwarves python3 ccache mkbootimg
          TOOLCHAIN_ARCHIVE="$GITHUB_WORKSPACE/work/_tmp/clang-r563880c.tar.gz"
          mkdir -p "$(dirname "$TOOLCHAIN_ARCHIVE")"
          gh release download toolchain-AOSP-Clang-21.0.0-r563880c \
            -p clang-r563880c.tar.gz -R "$GITHUB_REPOSITORY" -D "$(dirname "$TOOLCHAIN_ARCHIVE")"
          python3 scripts/build.py --workflow --verify-toolchain "$TOOLCHAIN_ARCHIVE"
          mkdir -p clang
          tar xzf "$TOOLCHAIN_ARCHIVE" -C clang
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"
          mkdir -p "$GITHUB_WORKSPACE/work/_tmp/gki"
          python3 - <<'PY' >"$GITHUB_WORKSPACE/work/_tmp/gki/generate_gki_certificate.py"
          print('def generate_gki_certificate(*args, **kwargs):')
          print('    raise SystemExit("GKI signing is not enabled by this workflow")')
          PY
          echo "PYTHONPATH=$GITHUB_WORKSPACE/work/_tmp" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: clang --version && clang -print-prog-name=ld.lld

      - name: Configure ccache
        run: |
          set -euo pipefail
          sudo cp -f lib/ccache-ecs /usr/local/bin/ccache
          sudo chmod +x /usr/local/bin/ccache
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache_ace6" >> "$GITHUB_ENV"
          echo 'CCACHE_MAXSIZE=3G' >> "$GITHUB_ENV"
          echo 'CCACHE_IS_KERNEL_COMPILING=true' >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ccache_ace6"
          echo 'sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros' \
            >> "$GITHUB_WORKSPACE/.ccache_ace6/ccache.conf"
          ccache --version

      - name: Resolve common build fingerprint
        id: fingerprint
        run: python3 scripts/build.py --workflow --fingerprint

      - name: Load ccache cache
        id: ccache-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache_ace6
          key: ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}
          restore-keys: |
            ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}-
            ccache-ace6-O2-FT-${{ runner.os }}-
            ccache-ace6-O2-FT-

      - name: Merge public ccache
        if: ${{ steps.ccache-restore.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          if gh release download ccache-ace6-O2-FT -p ccache-ace6-O2-FT.tar.zst -R "$GITHUB_REPOSITORY" 2>/dev/null; then
            tar -I zstd -xf ccache-ace6-O2-FT.tar.zst -C "$CCACHE_DIR"
            echo 'public ccache merged'
          else
            echo 'public ccache absent; continuing with local cache'
          fi

      - name: Common prepare, configure, build, verify and package
        id: common_build
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=1048576
          python3 scripts/build.py --workflow

      - name: Save ccache
        if: ${{ inputs.ccache_update }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache_ace6
          key: ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}

      - name: Upload public ccache
        if: ${{ inputs.ccache_update }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CACHE_ARCHIVE="$GITHUB_WORKSPACE/work/_tmp/ccache-ace6-O2-FT.tar.zst"
          tar -I zstd -cf "$CACHE_ARCHIVE" -C "$CCACHE_DIR" .
          gh release create ccache-ace6-O2-FT "$CACHE_ARCHIVE" -R "$GITHUB_REPOSITORY" \
            --notes 'Ace6 O2-FT public ccache' 2>/dev/null || \
            gh release upload ccache-ace6-O2-FT "$CACHE_ARCHIVE" -R "$GITHUB_REPOSITORY" --clobber

      - name: Upload ccache debug log
        if: ${{ inputs.ccache_debug }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ccache-debug-log
          path: work/_tmp/ccache.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.common_build.outputs.ak3name }}
          path: out/*
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.release_enable && needs.build.outputs.release_allowed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: release_zips
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          ACE6_RELEASE_TAG: ${{ inputs.tag }}
          ACE6_RELEASE_KSU_TYPE: ${{ inputs.ksu_type }}
          ACE6_RELEASE_KSUVER: ${{ needs.build.outputs.ksuver }}
          ACE6_RELEASE_KERNELREL: ${{ needs.build.outputs.kernelrel || 'n/a' }}
          ACE6_RELEASE_KERNELVER: ${{ needs.build.outputs.kernelver || 'n/a' }}
          ACE6_RELEASE_ARTIFACT: ${{ needs.build.outputs.ak3name }}
        run: |
          set -euo pipefail
          TAG="$ACE6_RELEASE_TAG"
          if [ -z "$TAG" ]; then TAG="kernel-$(date +%Y%m%d-%H%M%S)-ksu$ACE6_RELEASE_KSUVER"; fi
          cat > release_zips/release_notes.md <<EOF
          # Ace6 Kernel Build

          - Kernel: $ACE6_RELEASE_KERNELREL
          - Build: $ACE6_RELEASE_KERNELVER
          - KernelSU: $ACE6_RELEASE_KSU_TYPE / $ACE6_RELEASE_KSUVER
          - Artifact: $ACE6_RELEASE_ARTIFACT
          - Manifest is included alongside the artifact.
          EOF
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "Ace6 Kernel $ACE6_RELEASE_KSU_TYPE" \
            --notes-file release_zips/release_notes.md release_zips/*.zip release_zips/build-manifest.json
