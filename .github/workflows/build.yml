name: Build Ace6 Kernel

on:
  workflow_dispatch:      # Manual trigger (main entry)
    inputs:
      # ---------- KernelSU ----------
      ksu_type:
        description: 'KernelSU variant (resukisu = built-in KSU, none = no KSU)'
        required: true
        type: choice
        default: 'none'
        options:
          - 'resukisu'
          - 'none'
      susfs_enable:
        description: 'SUSFS mount/root hiding (only takes effect when KernelSU is enabled above)'
        required: true
        type: boolean
        default: 'false'
      # ---------- Performance ----------
      lz4_zstd:
        description: 'lz4 1.10 + zstd 1.5.7 compression optimization'
        required: true
        type: boolean
        default: 'false'
      lz4kd_enable:
        description: 'LZ4KD algorithm (recommended with lz4+zstd)'
        required: true
        type: boolean
        default: 'false'
      show_all_algos:
        description: 'Enable ALL zram compression algorithms (lz4hc/842 too)'
        required: true
        type: boolean
        default: 'false'
      zram_writeback:
        description: 'ZRAM writeback support (idle/incompressible pages -> backing device; needs runtime backing_dev config)'
        required: true
        type: boolean
        default: 'false'
      # ---------- Features ----------
      droidspaces:
        description: 'Droidspaces container (standard = +ntsync, extend = more)'
        required: true
        type: choice
        default: 'false'
        options:
          - 'false'
          - 'standard'
          - 'extend'
      baseband_guard:
        description: 'Kernel-level Baseband Guard (anti-format)'
        required: true
        type: boolean
        default: 'false'
      cve_patch:
        description: 'CVE security patches (GhostLock)'
        required: true
        type: boolean
        default: 'false'
      better_net:
        description: 'Better network (ipset/iptables)'
        required: true
        type: boolean
        default: 'false'
      bbr_enable:
        description: 'BBR TCP congestion control'
        required: true
        type: boolean
        default: 'false'
      kpm_enable:
        description: 'KPM/KPN support (KpatchNext; may conflict with ReSukiSU built-in kpm)'
        required: true
        type: boolean
        default: 'false'
      rekernel_enable:
        description: 'Re:Kernel support (Freezer/NoActive binder hooks)'
        required: true
        type: boolean
        default: 'false'
      kernel_suffix:
        description: 'Kernel version suffix (e.g. perf; empty = real commit)'
        required: false
        type: string
        default: ''
      # ---------- Attribution ----------
      attribution_enable:
        description: 'Attribution (build tags/KSU version/AK3)'
        required: true
        type: boolean
        default: 'true'
      build_user:
        description: 'Attribution user'
        required: false
        type: string
        default: 'Lingguang'
      build_host:
        description: 'Attribution host'
        required: false
        type: string
        default: 'kernel-builder'
      # ---------- Release ----------
      release_enable:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: 'false'
      artifact_mode:
        description: 'Upload artifacts (ak3 or all: +Image+boot.img)'
        required: true
        type: choice
        default: 'ak3'
        options:
          - 'ak3'
          - 'all'
      ccache_update:
        description: 'Update public ccache (upload to Release)'
        required: true
        type: boolean
        default: 'false'
      ccache_debug:
        description: 'Upload ccache debug logs'
        required: true
        type: boolean
        default: 'false'
      tag:
        description: 'Release tag (empty = auto date)'
        required: false
        type: string
        default: ''
      build_time:
        description: 'Custom build time string (e.g. Sun Dec 01 08:10:00 UTC 2024); empty = current UTC time'
        required: false
        type: string
        default: ''
      debug_skip_build:
        description: 'Debug: skip kernel build, test packaging/upload only (creates dummy Image)'
        required: true
        type: boolean
        default: 'false'

concurrency:
  group: build-kernel
  cancel-in-progress: false

permissions:
  contents: write         # gh release create/upload for ccache + kernel releases

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      ak3name: ${{ steps.package.outputs.ak3name }}
      ksuver: ${{ steps.ksu_version.outputs.ksuver }}
    steps:
      - uses: actions/checkout@v4

      # ---------- Toolchain: AOSP clang r563880c (from Release) ----------
      - name: 🔧 Install AOSP Clang 21 (r563880c) + deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y zip zstd patch bc flex bison \
            libssl-dev libncurses-dev libelf-dev dwarves python3 ccache mkbootimg
          # Download official toolchain from Release
          gh release download "toolchain-AOSP-Clang-21.0.0-r563880c" -p "clang-r563880c.tar.gz" -R $GITHUB_REPOSITORY
          mkdir -p clang
          tar xzf clang-r563880c.tar.gz -C clang
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"
          # mkbootimg imports gki.generate_gki_certificate (AOSP GKI signing
          # module); kernel/build main has removed it. Provide a stub: the
          # function is only invoked when --gki_signing_key is passed, which
          # this workflow never does.
          mkdir -p /tmp/gki
          printf 'def generate_gki_certificate(*args, **kwargs):\n    raise SystemExit("GKI signing not supported (stub)")\n' > /tmp/gki/generate_gki_certificate.py
          echo "PYTHONPATH=/tmp" >> "$GITHUB_ENV"

      - name: ✅ Verify toolchain
        run: clang --version && clang -print-prog-name=ld.lld

      # ---------- ccache (cctv18-style) ----------
      - name: 🧹 Clean runner space (async, non-blocking)
        run: |
          # Deletes run in the background WITHOUT blocking the build:
          # - no `wait`: step returns immediately
          # - stdout/stderr -> /dev/null: releases the runner's pipe so the
          #   step does not hang waiting for the background processes
          # - setsid: detach from the job's process group
          (setsid sudo rm -rf /usr/share/dotnet >/dev/null 2>&1 &)
          (setsid sudo rm -rf /usr/local/lib/android >/dev/null 2>&1 &)
          (setsid sudo rm -rf /opt/ghc >/dev/null 2>&1 &)
          (setsid sudo rm -rf /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &)
          df -h

      - name: 💾 Configure ccache
        run: |
          # Use ccache-ECS (specialized kernel cache)
          sudo cp -f $GITHUB_WORKSPACE/lib/ccache-ecs /usr/local/bin/ccache
          sudo chmod +x /usr/local/bin/ccache
          # CCACHE_DIR inside the workspace: actions/cache handles workspace-relative
          # paths correctly on restore (an absolute $HOME path can restore to the
          # wrong location, silently nuking every build's cache hit rate)
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache_ace6" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          echo "CCACHE_IS_KERNEL_COMPILING=true" >> "$GITHUB_ENV"
          # sloppiness: relax cache matching for cross-build hits
          mkdir -p "$GITHUB_WORKSPACE/.ccache_ace6"
          echo "sloppiness = file_stat_matches,include_file_ctime,include_file_mtime,pch_defines,file_macro,time_macros" >> "$GITHUB_WORKSPACE/.ccache_ace6/ccache.conf"
          ccache --version

      - name: 🔑 Compute ccache fingerprint
        id: ccache-fp
        run: |
          # Everything that changes the kernel .config (feature toggles, suffix,
          # source commit) must change the cache key, otherwise a restore-keys
          # match on stale parameters would skip the Release pull and force a
          # full rebuild. build_time is intentionally excluded: it only touches
          # the timestamp files (sloppiness time_macros covers the rest).
          SRC=$(curl -sL "${{ vars.REPO_BASE || 'https://api.github.com' }}/repos/GuLingguang/oneplus-sm8750-kernel-pro/commits/lineage-23.2" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | grep -oE '"sha": "[0-9a-f]{40}"' | head -1 | grep -oE '[0-9a-f]{40}' || echo unknown)
          FP=$(printf '%s' "${{ inputs.ksu_type }}|${{ inputs.susfs_enable }}|${{ inputs.lz4_zstd }}|${{ inputs.lz4kd_enable }}|${{ inputs.show_all_algos }}|${{ inputs.zram_writeback }}|${{ inputs.droidspaces }}|${{ inputs.baseband_guard }}|${{ inputs.cve_patch }}|${{ inputs.better_net }}|${{ inputs.bbr_enable }}|${{ inputs.kpm_enable }}|${{ inputs.rekernel_enable }}|${{ inputs.kernel_suffix }}|$SRC" | md5sum | cut -d' ' -f1)
          echo "CCACHE_FP=$FP" >> "$GITHUB_ENV"
          echo "ccache fingerprint: $FP (src $SRC)"

      - name: 💾 Load ccache cache
        uses: actions/cache/restore@v5
        id: ccache-restore
        with:
          path: .ccache_ace6
          # fingerprint key: exact hit means identical parameters, so the
          # Release pull can be skipped; restore-keys only as stale fallback
          key: ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}
          restore-keys: |
            ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}-
            ccache-ace6-O2-FT-${{ runner.os }}-
            ccache-ace6-O2-FT-

      - name: 💾 Pull public ccache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Merge the authoritative Release cache into CCACHE_DIR. Do NOT trust
          # a "local cache hit" here: a non-empty dir is not proof the cache is
          # usable. Do NOT wipe the dir either - the GitHub cache restored by
          # Load may contain entries the Release archive lacks (ccache entry
          # filenames are content hashes, so overlapping files are identical
          # and merging is always safe).
          if [ "${{ steps.ccache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "GitHub cache hit (fingerprint match), skip public pull"
            exit 0
          fi
          mkdir -p ${{ env.CCACHE_DIR }}
          if gh release download "ccache-ace6-O2-FT" -p "ccache-ace6-O2-FT.tar.zst" -R $GITHUB_REPOSITORY 2>/dev/null; then
            echo "Public ccache downloaded, extracting (merge)..."
            tar -I zstd -xf ccache-ace6-O2-FT.tar.zst -C ${{ env.CCACHE_DIR }}
            echo "Public ccache merged!"
          else
            echo "Public ccache absent (first build), skip"
          fi

      # ---------- Prepare sources (3 repos) ----------
      - name: 📥 Prepare kernel sources
        run: |
          set -e
          mkdir -p work
          cd work
          # Get real branch commit (zip has no .git)
          SRC_COMMIT=$(curl -sL "${{ vars.REPO_BASE || 'https://api.github.com' }}/repos/GuLingguang/oneplus-sm8750-kernel-pro/commits/lineage-23.2" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | grep -oE '"sha": "[0-9a-f]{40}"' | head -1 | grep -oE '[0-9a-f]{40}' || true)
          echo "SRC_COMMIT=$SRC_COMMIT" >> "$GITHUB_ENV"
          echo "Source commit: $SRC_COMMIT"
          [ -n "$SRC_COMMIT" ] || { echo "WARN: failed to get commit, using plain -4k"; SRC_COMMIT=""; }
          # Download sources via zip (parallel)
          curl -sL "${{ vars.REPO_BASE || 'https://github.com' }}/GuLingguang/oneplus-sm8750-kernel-pro/archive/refs/heads/lineage-23.2.zip" -o src.zip &
          curl -sL "${{ vars.REPO_BASE || 'https://github.com' }}/Ace6-Development/android_kernel_oneplus_sm8750-modules/archive/refs/heads/lineage-23.2.zip" -o modules.zip &
          curl -sL "${{ vars.REPO_BASE || 'https://github.com' }}/LineageOS/android_kernel_oneplus_sm8750-devicetrees/archive/refs/heads/lineage-23.2.zip" -o dt.zip &
          wait
          unzip -q src.zip && mv oneplus-sm8750-kernel-pro-lineage-23.2 src
          unzip -q modules.zip && mv android_kernel_oneplus_sm8750-modules-lineage-23.2 sm8750-modules
          unzip -q dt.zip && mv android_kernel_oneplus_sm8750-devicetrees-lineage-23.2 sm8750-devicetrees
          rm -f src.zip modules.zip dt.zip
          # Verify symlink targets
          for t in src/drivers/base/kernelFwUpdate/Kconfig src/arch/arm64/boot/dts/vendor; do
            [ -e "$t" ] || { echo "missing symlink target: $t"; exit 1; }
          done

      # ---------- Apply patches (by toggle) ----------
      - name: 🔧 Apply compile fixes
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/07_compile_fixes.patch
        working-directory: work/src

      - name: 🔧 Apply KSU hooks
        if: ${{ inputs.ksu_type != 'none' }}
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/00_ksu_hooks.patch
        working-directory: work/src

      - name: 🔧 Apply SUSFS main patch
        if: ${{ inputs.susfs_enable && inputs.ksu_type != 'none' }}
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/01_susfs_main.patch
        working-directory: work/src

      - name: 🔧 Apply lz4 patch
        if: inputs.lz4_zstd
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/02_lz4.patch
        working-directory: work/src

      - name: 🔧 Apply zstd patch
        if: inputs.lz4_zstd
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/03_zstd.patch
        working-directory: work/src

      - name: 🔧 Apply LZ4KD patch
        if: inputs.lz4kd_enable
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/04_lz4kd.patch
        working-directory: work/src

      - name: 🔧 Apply Droidspaces patch
        if: ${{ inputs.droidspaces != 'false' }}
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/05_droidspaces.patch
        working-directory: work/src

      - name: 🔧 Apply Baseband Guard patch
        if: inputs.baseband_guard
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/06_baseband_guard.patch
        working-directory: work/src

      - name: 🔧 Apply CVE patch
        if: inputs.cve_patch
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/08_cve.patch
        working-directory: work/src

      - name: 🔧 Apply Re:Kernel patch
        if: ${{ inputs.rekernel_enable }}
        # source patch (binder/signal/netlink hooks, #ifdef CONFIG_REKERNEL)
        # MUST run before the build - was previously applied after Build
        # kernel, which silently shipped kernels without Re:Kernel
        run: patch -p1 -F3 --batch -f < $GITHUB_WORKSPACE/patches/split/09_rekernel.patch
        working-directory: work/src

      # ---------- Copy extra files (new files) ----------
      - name: 📄 Copy extra files
        run: |
          set -e
          # SUSFS new files
          if [ "${{ inputs.susfs_enable }}" = "true" ] && [ "${{ inputs.ksu_type }}" != "none" ]; then
            cp -r patches/extra/fs/susfs.c work/src/fs/
            cp -r patches/extra/include/linux/susfs.h patches/extra/include/linux/susfs_def.h work/src/include/linux/
          fi
          # lz4 1.10 new lib files
          if [ "${{ inputs.lz4_zstd }}" = "true" ]; then
            cp -r patches/extra/lib/lz4 work/src/lib/
          fi
          # zstd 1.5.7 new lib files
          if [ "${{ inputs.lz4_zstd }}" = "true" ]; then
            cp -r patches/extra/lib/zstd/common/allocations.h patches/extra/lib/zstd/common/bits.h work/src/lib/zstd/common/
            cp -r patches/extra/lib/zstd/compress/zstd_preSplit.c patches/extra/lib/zstd/compress/zstd_preSplit.h work/src/lib/zstd/compress/
          fi
          # LZ4KD new files
          if [ "${{ inputs.lz4kd_enable }}" = "true" ]; then
            cp -r patches/extra/crypto/lz4k.c patches/extra/crypto/lz4kd.c work/src/crypto/
            cp -r patches/extra/include/linux/lz4k.h patches/extra/include/linux/lz4kd.h work/src/include/linux/
            cp -r patches/extra/lib/lz4k work/src/lib/
            cp -r patches/extra/lib/lz4kd work/src/lib/
          fi
          # Droidspaces new files
          if [ "${{ inputs.droidspaces }}" != "false" ]; then
            cp -r patches/extra/drivers/misc/ntsync.c work/src/drivers/misc/
            cp -r patches/extra/include/uapi/linux/ntsync.h work/src/include/uapi/linux/
            cp -r patches/extra/drivers/gpu/drm/evdi work/src/drivers/gpu/drm/
          fi
          # Baseband-guard new files
          if [ "${{ inputs.baseband_guard }}" = "true" ]; then
            cp -r patches/extra/Baseband-guard work/src/
            ln -sfn ../Baseband-guard work/src/security/baseband-guard
          fi

      # ---------- KernelSU (by ksu_type) ----------
      - name: 🔗 Integrate KernelSU
        if: ${{ inputs.ksu_type != 'none' }}
        run: |
          set -e
          cd work/src
          case "${{ inputs.ksu_type }}" in
            resukisu) KSU_REPO="https://github.com/ReSukiSU/ReSukiSU.git" ;;
            none)     echo "no KSU"; exit 0 ;;
          esac
          rm -rf KernelSU drivers/kernelsu
          git clone "$KSU_REPO" KernelSU
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || \
            sed -i "/endmenu/i\source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
        env:
          KSU_REPO: ""

      # ---------- KSU version ----------
      - name: 🔢 Compute KSU version
        id: ksu_version
        if: ${{ inputs.ksu_type != 'none' }}
        run: |
          COUNT=$(git -C work/src/KernelSU rev-list --count HEAD)
          VER=$((30000 + COUNT + 700))
          echo "ksuver=$VER" >> "$GITHUB_OUTPUT"
          echo "KSU version: $VER ($COUNT commits)"

      # ---------- SUSFS KSU adaptation ----------
      - name: 🔧 Apply SUSFS KSU adaptation
        if: ${{ inputs.susfs_enable && inputs.ksu_type != 'none' }}
        run: |
          cd KernelSU
          git apply --check $GITHUB_WORKSPACE/patches/02_ksu.patch 2>/dev/null && git apply $GITHUB_WORKSPACE/patches/02_ksu.patch \
            || echo "WARN: 02_ksu.patch not applied automatically (KSU version may have changed)" >&2
        working-directory: work/src

      # ---------- Attribution ----------
      - name: ✍️ Configure attribution
        run: |
          if [ "${{ inputs.attribution_enable }}" = "true" ]; then
            echo "BUILD_USER=${{ inputs.build_user }}" >> "$GITHUB_ENV"
            echo "BUILD_HOST=${{ inputs.build_host }}" >> "$GITHUB_ENV"
            # KSU version attribution (REPO_NAME)
            if [ "${{ inputs.ksu_type }}" != "none" ]; then
              sed -i "s/^REPO_NAME := .*/REPO_NAME := ${{ inputs.build_user }}/" work/src/KernelSU/kernel/Kbuild
            fi
          else
            echo "BUILD_USER=" >> "$GITHUB_ENV"
            echo "BUILD_HOST=" >> "$GITHUB_ENV"
          fi

      # ---------- Config ----------
      - name: ⚙️ Deploy config
        run: |
          set -e
          cd work/src
          cp $GITHUB_WORKSPACE/config/config_ace6_final.config .config
          # LOCALVERSION: custom suffix or real commit
          if [ -n "${{ inputs.kernel_suffix }}" ]; then
            ./scripts/config --file .config --set-str CONFIG_LOCALVERSION "-4k-${{ inputs.kernel_suffix }}"
          else
            ./scripts/config --file .config --set-str CONFIG_LOCALVERSION "-4k-g${SRC_COMMIT:0:12}"
          fi
          ./scripts/config --file .config -d CONFIG_LOCALVERSION_AUTO
          # Adjust config by toggles
          if [ "${{ inputs.ksu_type }}" = "none" ]; then
            ./scripts/config --file .config -d CONFIG_KSU -d CONFIG_KSU_SUSFS
          fi
          if [ "${{ inputs.susfs_enable }}" != "true" ] || [ "${{ inputs.ksu_type }}" = "none" ]; then
            ./scripts/config --file .config -d CONFIG_KSU_SUSFS
          fi
          if [ "${{ inputs.droidspaces }}" = "false" ]; then
            ./scripts/config --file .config \
              -d CONFIG_SYSVIPC -d CONFIG_NTSYNC -d CONFIG_DRM_LINDROID_EVDI
          fi
          if [ "${{ inputs.droidspaces }}" != "extend" ]; then
            ./scripts/config --file .config -d CONFIG_DRM_LINDROID_EVDI
          fi
          if [ "${{ inputs.lz4kd_enable }}" != "true" ]; then
            ./scripts/config --file .config \
              -d CONFIG_LZ4K_COMPRESS -d CONFIG_LZ4KD_COMPRESS -d CONFIG_CRYPTO_LZ4K -d CONFIG_CRYPTO_LZ4KD
          fi
          if [ "${{ inputs.baseband_guard }}" != "true" ]; then
            ./scripts/config --file .config -d CONFIG_BBG
          fi
          if [ "${{ inputs.better_net }}" != "true" ]; then
            ./scripts/config --file .config -d CONFIG_IP_SET -d CONFIG_BPF_STREAM_PARSER -d CONFIG_IP6_NF_NAT
          fi
          # All zram algorithms: enable lz4hc/842 (backends entries exist natively,
          # they just need their crypto CONFIGs; lz4k/lz4kd/deflate come from
          # 04_lz4kd.patch + the base config)
          if [ "${{ inputs.show_all_algos }}" = "true" ]; then
            ./scripts/config --file .config -e CONFIG_CRYPTO_LZ4HC -e CONFIG_CRYPTO_842
          fi
          # ZRAM writeback (idle/incompressible pages to a backing device)
          if [ "${{ inputs.zram_writeback }}" != "true" ]; then
            ./scripts/config --file .config -d CONFIG_ZRAM_WRITEBACK -d CONFIG_ZRAM_MEMORY_TRACKING
          fi
          # BBR congestion control
          if [ "${{ inputs.bbr_enable }}" = "true" ]; then
            ./scripts/config --file .config -e CONFIG_TCP_CONG_ADVANCED -e CONFIG_TCP_CONG_BBR
          fi
          # Re:Kernel (binder hooks)
          if [ "${{ inputs.rekernel_enable }}" = "true" ]; then
            ./scripts/config --file .config -e CONFIG_REKERNEL
          fi
          export LLVM=1 LLVM_IAS=1
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 olddefconfig
          grep -qE 'CONFIG_LOCALVERSION="-4k-(g[0-9a-f]{12}|[^"]+)"' .config || exit 1

      # ---------- Build ----------
      - name: 🛠️ Build kernel
        if: ${{ !inputs.debug_skip_build }}
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          export LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_USER="$BUILD_USER"
          if [ "${{ inputs.ccache_debug }}" = "true" ]; then
            export CCACHE_LOGFILE="$GITHUB_WORKSPACE/ccache.log"
          fi
          export KBUILD_BUILD_HOST="$BUILD_HOST"
          # Custom build time (KBUILD_BUILD_TIMESTAMP)
          if [[ -n "${{ inputs.build_time }}" && "${{ inputs.build_time }}" != "N" && "${{ inputs.build_time }}" != "n" ]]; then
            export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_time }}"
            echo "Build time: ${{ inputs.build_time }}"
          fi
          # faketime time-fixing (reproducible builds)
          cd $GITHUB_WORKSPACE
          chmod 777 lib/*.so
          export FAKESTAT="2025-05-25 12:00:00"
          export FAKETIME="@2025-05-25 13:00:00"
          SO_DIR="$GITHUB_WORKSPACE/lib"
          export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          echo '#!/bin/bash' > cc-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
          echo 'ccache clang "$@"' >> cc-wrapper
          echo '#!/bin/bash' > ld-wrapper
          echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
          echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
          echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
          echo 'ld.lld "$@"' >> ld-wrapper
          chmod +x cc-wrapper ld-wrapper
          cd work/src
          set -o pipefail
          make LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="$GITHUB_WORKSPACE/cc-wrapper" LD="$GITHUB_WORKSPACE/ld-wrapper" HOSTLD=ld.lld KCFLAGS+=-O2 -j$(nproc --all) Image
          echo "ccache status:"
          ccache -s
          [ -f arch/arm64/boot/Image ] || exit 1

      # ---------- Verify ----------
      - name: Debug - create dummy Image (skip build)
        if: ${{ inputs.debug_skip_build }}
        run: |
          mkdir -p work/src/arch/arm64/boot
          echo "DEBUG DUMMY IMAGE" > work/src/arch/arm64/boot/Image
          echo "Dummy Image created (debug mode)"

      - name: ✅ Verify artifacts
        if: ${{ !inputs.debug_skip_build }}
        run: |
          cd work/src
          strings arch/arm64/boot/Image | grep -q "Linux version 6.6.139" || exit 1
          ls -la arch/arm64/boot/Image

      # ---------- KPM/KPN patch (post-build, binary) ----------
      - name: 🧩 Apply KPM patch
        if: ${{ inputs.kpm_enable && !inputs.debug_skip_build }}
        run: |
          cd work/src/arch/arm64/boot
          wget -q https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kptools-linux
          wget -q https://github.com/KernelSU-Next/KPatch-Next/releases/latest/download/kpimg-linux
          chmod +x kptools-linux
          ./kptools-linux -p -i ./Image -k ./kpimg-linux -o ./oImage
          rm -f Image
          mv oImage Image
          echo "KPM patched"

      # ---------- Save ccache ----------
      - name: 💾 Save ccache
        if: ${{ inputs.ccache_update }}
        uses: actions/cache/save@v5
        with:
          # workspace-relative path (see Load step); fingerprint key: same
          # parameters -> same key -> GitHub skips the re-upload (identical
          # cache), new parameters -> fresh save
          path: .ccache_ace6
          key: ccache-ace6-O2-FT-${{ runner.os }}-${{ github.ref_name }}-${{ env.CCACHE_FP }}

      - name: 📤 Upload public ccache
        if: ${{ inputs.ccache_update }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Package ccache and upload to Release
          echo "Packaging public ccache ..."
          tar -I zstd -cf ccache-ace6-O2-FT.tar.zst -C ${{ env.CCACHE_DIR }} .
          echo "ccache size: $(du -sh ccache-ace6-O2-FT.tar.zst | cut -f1)"
          # Upload (create Release if missing)
          gh release create "ccache-ace6-O2-FT" ccache-ace6-O2-FT.tar.zst --notes '🏷️ Category: ccache | ace6-O2-FT — Public ccache for Ace6 kernel builds' 2>/dev/null \
            || gh release upload "ccache-ace6-O2-FT" ccache-ace6-O2-FT.tar.zst --clobber
          echo "Public ccache uploaded!"

      - name: 🔍 Upload ccache debug log
        if: ${{ inputs.ccache_debug }}
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-log
          path: ccache.log
          if-no-files-found: ignore

      # ---------- Package AK3 ----------
      - name: 📦 Package AK3
        id: package
        run: |
          set -e
          mkdir -p out pack
          [ -f work/src/arch/arm64/boot/Image ] || { echo "ERROR: Image not found"; exit 1; }
          cp -a ak3/. pack/
          cp work/src/arch/arm64/boot/Image pack/Image
          # Verify Image exists and non-empty
          SIZE=$(stat -c%s work/src/arch/arm64/boot/Image)
          echo "Image size: $SIZE"
          [ "$SIZE" -gt 0 ] || { echo "ERROR: Image is empty"; exit 1; }
          # AK3 attribution
          if [ "${{ inputs.attribution_enable }}" = "true" ]; then
            sed -i "s#kernel.string=.*#kernel.string=Ace6 Kernel | Build by ${{ inputs.build_user }}#" pack/anykernel.sh
          else
            sed -i "s#kernel.string=.*#kernel.string=Ace6 Kernel#" pack/anykernel.sh
          fi
          STAMP=$(date +%Y%m%d)
          KSUVER="${{ steps.ksu_version.outputs.ksuver }}"
          ZIP="Kernel-Ace6-${{ inputs.build_user }}-ksu${KSUVER}-$STAMP.zip"
          cd pack && zip -r9 "../out/$ZIP" . -x "*.git*" >/dev/null
          echo "ak3name=$ZIP" >> "$GITHUB_OUTPUT"
          ls -lh "../out/$ZIP"
          # all mode: also generate Image + boot.img
          if [ "${{ inputs.artifact_mode }}" = "all" ]; then
            cp $GITHUB_WORKSPACE/work/src/arch/arm64/boot/Image ../out/Image
            # boot.img (official params: header v4)
            mkbootimg --kernel $GITHUB_WORKSPACE/work/src/arch/arm64/boot/Image \
              --header_version 4 --os_version 16.0.0 --os_patch_level 2026-07 \
              --pagesize 4096 --base 0x80000000 -o ../out/boot.img
            echo "all mode: Image + boot.img generated"
          fi

      # ---------- Upload artifacts ----------
      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ak3name }}
          path: out/*
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: ${{ inputs.release_enable }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.ak3name }}
          path: release_zips
      - name: 🚀 Publish Release
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="kernel-$(date +%Y%m%d-%H%M%S)-ksu${{ needs.build.outputs.ksuver }}"
          fi
          cat <<EOF > release_notes.md
          # ⚡ Ace6 Kernel Build

          🏷️ **Category**: \`kernel\` | \`${{ inputs.ksu_type }}\` | ksu${{ needs.build.outputs.ksuver }}

          ---

          ## 📋 Version

          | Item | Value |
          |---|---|
          | Kernel | 6.6.139-4k |
          | KernelSU | ${{ needs.build.outputs.ksuver }} |
          | Build date | $(date +%Y-%m-%d) |

          ## ✨ Features

          | Feature | State |
          |---|---|
          | KernelSU | ${{ inputs.ksu_type }} |
          | SUSFS | ${{ inputs.susfs_enable }} |
          | lz4/zstd | ${{ inputs.lz4_zstd }} |
          | LZ4KD | ${{ inputs.lz4kd_enable }} |
          | Droidspaces | ${{ inputs.droidspaces }} |
          | Baseband Guard | ${{ inputs.baseband_guard }} |
          | CVE | ${{ inputs.cve_patch }} |
          | BBR | ${{ inputs.bbr_enable }} |
          | Re:Kernel | ${{ inputs.rekernel_enable }} |

          ## 📥 Manager downloads

          - [ReSukiSU](https://github.com/ReSukiSU/ReSukiSU/releases)
          - [SukiSU Ultra](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases)
          - [KernelSU Next](https://github.com/KernelSU-Next/KernelSU-Next/releases)
          - [KSU (original)](https://github.com/tiann/KernelSU/releases)

          ## 📲 Flashing

          Flash the AK3 zip via recovery (TWRP/OrangeFox/OFRP).
          EOF
          gh release create "$TAG" -R $GITHUB_REPOSITORY \
            --title "Ace6 Kernel ${{ inputs.ksu_type }} (ksu${{ needs.build.outputs.ksuver }})" \
            --notes-file release_notes.md \
            release_zips/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
